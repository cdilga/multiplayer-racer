# Keep target/ small: a local target/ once filled a Mac's disk (Playtest-1 plan §13b.5).
# Workspace-wide cargo on the Mac is hook-blocked; per-crate builds stay within a 15 GiB target/.

[build]
# The config form of CARGO_INCREMENTAL=0: incremental caches are the biggest part of a dev target/.
incremental = false

[env]
CARGO_INCREMENTAL = "0"

# Slim dev profile: line tables only (backtraces keep file:line), no debug info for dependencies.
# Optimised (br-15gd, 2026-10-17): the sim banks drive Rapier for minutes of game time, and unoptimised they dominated CI
# (jj-procgen handling hawk_dash: 707 s at opt-level 0, 40 s with deps at 3 and our crates at 1, on rch). Debug assertions
# and overflow checks stay on; Rust doesn't reorder float maths by opt level, so results are the same bits.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

# asupersync (the server's runtime) at opt-level 3 needs more memory than the CI build runner has: rustc was SIGKILLed
# (CI 5917's build job, so every browser lane failed). Nothing it runs in tests is hot; 1 compiles in a fraction.
[profile.dev.package.asupersync]
opt-level = 1

[profile.test]
debug = "line-tables-only"

# WASM tests run in Node through wasm-bindgen-test-runner (same version as the wasm-bindgen crate, 0.2.129): the native =
# WASM parity mechanism (Playtest-1 plan §13), e.g. `cargo test --target wasm32-unknown-unknown -p jj-map --test wasm_parity`.
[target.wasm32-unknown-unknown]
runner = "scripts/wasm-test-runner.sh"  # wraps wasm-bindgen-test-runner (TMPDIR outside the repo)
