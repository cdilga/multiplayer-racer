<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joystick Jammers · Host</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1a1f;
        color: #f4efe6;
        font: 16px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      .jj-world {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The grid's spare cells (P1-R04): paper backdrop, never black; the accepted look is P1-R04.style's. */
      .jj-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .jj-filler,
      .jj-chip {
        position: absolute;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 4%;
        overflow: hidden;
        color: #15203a;
        background: #fff4de radial-gradient(rgb(200 98 46 / 0.14) 22%, transparent 24%) 0 0 / 14px 14px;
        font: 700 clamp(10px, 2.2vmin, 40px) / 1.2 system-ui, sans-serif;
        text-align: center;
      }
      .jj-filler:not([data-kind='margin']) {
        box-shadow: inset 0 0 0 3px rgb(21 32 58 / 0.25);
      }
      .jj-qr svg {
        display: block;
        width: min(70cqmin, 60vmin);
        height: auto;
      }
      .jj-filler[data-kind='qr'] {
        container-type: size;
      }
      .jj-qr svg,
      .jj-chip svg {
        background: #fff;
      }
      .jj-join-text {
        max-width: 92%;
        overflow-wrap: anywhere;
      }
      .jj-filler[data-kind='code'] .jj-join-text {
        font-size: clamp(9px, 1.4vmin, 28px);
      }
      .jj-chip {
        display: flex;
        gap: 0.4em;
        padding: 0 0.8em;
        border-radius: 999px;
        background: #15203a;
        color: #fff4de;
        font-size: clamp(9px, 1.6vmin, 30px);
        white-space: nowrap;
        max-width: 60vw;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.3);
      }
      @media (max-width: 960px), (max-height: 500px) {
        .jj-chip span {
          display: none;
        }
      }
      .jj-arrows {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .jj-arrow {
        position: absolute;
        color: #ffd23f;
        font-size: 32px;
        text-shadow: 0 0 4px #15203a;
      }
      .jj-render-chip {
        position: fixed;
        right: 8px;
        bottom: 8px;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgb(0 0 0 / 0.45);
        font-size: 11px;
        opacity: 0.8;
        pointer-events: none;
        max-width: calc(100vw - 16px);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* The input drawer (P1-C05) floats over the world until the host UI (P1-U02) places it. */
      [data-jj-input-drawer] {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 1;
        box-sizing: border-box;
        max-width: min(30rem, calc(100vw - 16px));
        max-height: calc(100vh - 48px);
        overflow: auto;
        padding: 6px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.6);
        font-size: 13px;
      }
      [data-jj-input-drawer]:empty {
        display: none;
      }
      [data-jj-input-drawer] .drawer-head {
        font-weight: 700;
      }
      /* On the grid and while racing the drawer folds to its head, bottom centre, so it covers no tile's name or place; hovering or
         focusing it opens it there. */
      :is([data-jj-phase='Countdown'], [data-jj-phase='Running']) [data-jj-input-drawer] {
        top: auto;
        bottom: 8px;
        left: 50%;
        width: max-content;
        translate: -50% 0;
      }
      :is([data-jj-phase='Countdown'], [data-jj-phase='Running']) [data-jj-input-drawer]:not(:hover):not(:focus-within) ul {
        width: 0;
        max-height: 0;
        margin: 0;
        overflow: hidden;
      }
      /* A phone host: keep the drawer to a corner of the world. */
      @media (max-width: 960px), (max-height: 500px) {
        [data-jj-input-drawer] {
          max-width: min(20rem, 45vw);
          max-height: 35vh;
          padding: 4px 8px;
          font-size: 10px;
        }
        [data-jj-input-drawer] ul {
          margin: 2px 0;
          padding-left: 14px;
        }
      }
      .jj-unsupported {
        box-sizing: border-box;
        max-width: 36rem;
        margin: 0 auto;
        padding: 12vh 16px 16px;
      }
      .jj-unsupported h1 {
        font-size: 1.6rem;
        margin: 0 0 1rem;
      }
      .jj-unsupported li {
        margin: 0.4rem 0;
      }
      .jj-join {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.4rem;
        border-radius: 999px;
        background: #ffd23f;
        color: #1b1a1f;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
