<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15203A" />
    <title>Joystick Jammers</title>
    <meta name="description" content="Everyone races on one big screen, steering from their own phone. Grab your mates, open a browser, no installs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joystick Jammers" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:title" content="Joystick Jammers: the phone-controller party racer" />
    <meta property="og:description" content="Everyone races on one big screen, steering from their own phone. Grab your mates, open a browser, no installs." />
    <!-- jj-server makes these absolute with JJ_PUBLIC_ORIGIN (crates/jj-server/src/statics.rs) -->
    <meta property="og:image" content="/assets/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joystick Jammers: the wordmark and a chunky blue rally car over outback red earth" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joystick Jammers: the phone-controller party racer" />
    <meta name="twitter:description" content="Everyone races on one big screen, steering from their own phone. Grab your mates, open a browser, no installs." />
    <meta name="twitter:image" content="/assets/og-card.png" />
    <link rel="icon" href="../../art/ui/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="../../art/ui/brand/apple-touch-icon-180.png" />
  </head>
  <body>
    <main class="stage" id="app">
      <section class="brand">
        <h1 class="wordmark"><img src="../../art/ui/brand/wordmark.svg" alt="Joystick Jammers" width="720" height="292" /></h1>
        <p class="pitch">Everyone races on one shared screen, steering from their own phone. Perfect for an arvo with the blokes and sheilas.</p>
        <img class="car" src="../../art/ui/brand/renders/cruz-missile-hero.png" alt="" width="956" height="490" />
      </section>

      <div class="actions">
        <section class="panel host" aria-labelledby="host-h">
          <h2 class="kicker" id="host-h">On the big screen</h2>
          <p>Open this on the laptop or TV that will show the race.</p>
          <a class="btn btn-primary big wide display brush" id="host-link" href="host">Host a room</a>
        </section>

        <form class="panel join" id="join-form" novalidate aria-labelledby="join-h">
          <h2 class="kicker" id="join-h">On your phone</h2>
          <label class="field-label" for="code">Room code</label>
          <div class="code-row">
            <input class="field code" id="code" name="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="ABCD" aria-describedby="code-error" />
            <button class="btn btn-secondary btn-icon" id="scan" type="button" aria-label="Scan QR code"></button>
          </div>
          <p class="field-error" id="code-error" role="alert" hidden></p>
          <button class="btn btn-primary big wide display brush" id="join" type="submit">Join a room</button>
        </form>
      </div>
      <footer class="foot"><a class="credits-link" id="credits-link" href="credits">Credits and licences</a></footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
