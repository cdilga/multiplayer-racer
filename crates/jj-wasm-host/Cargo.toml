[package]
name = "jj-wasm-host"
description = "wasm-bindgen facade for the host sim worker (session + input + sim)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jj-session.workspace = true
jj-input.workspace = true
jj-sim.workspace = true
jj-protocol.workspace = true
jj-map.workspace = true
jj-types.workspace = true
sha2.workspace = true
wasm-bindgen.workspace = true
# The test surface (P1-F05b), only in the `testing` build.
jj-fixture = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
# The test chunk's worker (web/host/src/testing/): the `jj sim` fixture commands, exact-tick scheduling, a deliberate
# panic and the test-side controller encoders. The shipped worker is built without it (scripts/build-host-wasm.sh).
testing = ["dep:jj-fixture", "dep:serde"]

[lints]
workspace = true
