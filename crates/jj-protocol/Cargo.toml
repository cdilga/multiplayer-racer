[package]
name = "jj-protocol"
description = "Wire formats: controller state, commands and HUD, signalling DTOs and the host worker ABI, with goldens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Lets other crates' tests generate protocol messages (structured fuzzing, property tests).
arbitrary = ["dep:arbitrary", "jj-types/arbitrary"]

[dependencies]
jj-types.workspace = true
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
jj-types = { workspace = true, features = ["arbitrary"] }
arbitrary.workspace = true
proptest.workspace = true

[lints]
workspace = true
