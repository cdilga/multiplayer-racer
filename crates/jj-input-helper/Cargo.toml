[package]
name = "jj-input-helper"
description = "Native input helper (P1-C12.1): every keyboard and every pad on the host computer as its own local source, fed to the paired host page over a localhost WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "jj-input-helper"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
base64.workspace = true
getrandom.workspace = true

# Linux: evdev (Apache-2.0 OR MIT) reads /dev/input/event* per device, keyboards and pads alike.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "=0.13.2", default-features = false }

# Windows: Raw Input tells keyboards apart (per-device WM_INPUT); windows-sys is Microsoft's MIT OR Apache-2.0 binding.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
