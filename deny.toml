# cargo deny: licences, advisories, bans and sources for the 0.2 workspace (P1-F01; P1-F03 qualifies
# each dependency). Run with `scripts/ci/deny.sh`.

[graph]
all-features = true
# The targets 0.2 builds: CI and the RCH workers (x86_64 Linux), the Mac (aarch64 macOS) and the WASM facades. Without the
# list, cargo-deny walks every target, and wasm-bindgen-futures' emscripten-only optional Tokio (behind an unstable cfg,
# reached only from the test-only wasm-bindgen-test) fails R2 for code that's never built.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "wasm32-unknown-unknown"]

[advisories]
yanked = "deny"

[licenses]
# The game is GPL-3.0-or-later; everything below is compatible with it.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
# Allowances for licences the graph will use as P1-F03 qualifies dependencies (Rapier, Asupersync, …).
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false`; they carry the workspace licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# R2: the server runs on Asupersync; Tokio never ships. scripts/ci/no-tokio.sh checks the same thing
# with the path to the offender.
deny = [{ crate = "tokio", reason = "R2: Asupersync, no Tokio" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
