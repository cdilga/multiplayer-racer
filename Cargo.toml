[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/cdilga/multiplayer-racer"

[workspace.dependencies]
jj-types = { path = "crates/jj-types" }
jj-protocol = { path = "crates/jj-protocol" }
jj-input = { path = "crates/jj-input" }
jj-session = { path = "crates/jj-session" }
jj-sim = { path = "crates/jj-sim" }
jj-map = { path = "crates/jj-map" }
jj-procgen = { path = "crates/jj-procgen" }
jj-contracts = { path = "crates/jj-contracts" }

# Pin the wasm-bindgen crate exactly: the CLI on the Mac, eris and CI must be the same version.
wasm-bindgen = "=0.2.129"

# Wire formats (P1-N01): serde + postcard for the command channel and the worker ABI, JSON for the server API.
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde_json = "1.0.151"
# Physics (P1-F03 pin, P1-S01 uses it): enhanced-determinism forces libm maths so replays are bit-identical across targets.
rapier3d = { version = "0.36.0", features = ["enhanced-determinism"] }
# Map hashing (P1-M01): the gameplay hash is SHA-256 of the canonical bytes.
sha2 = "0.11.0"
# Player names (P1-N07a): grapheme count and NFC, per plan §9.
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"
# Test-only: structured fuzzing and property tests.
arbitrary = { version = "1.4.2", features = ["derive"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# Test-only: native = WASM parity tests in Node (wasm-bindgen-test-runner, the same version as wasm-bindgen).
wasm-bindgen-test = "0.3.79"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
