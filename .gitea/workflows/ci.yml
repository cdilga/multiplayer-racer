# CI from P1-F01, brought up on Gitea by P1-D01: the checks the workspace scaffold guarantees. P1-F02 grows this into
# the fast/build/browser lanes (Playtest-1 plan §12.1); scripts/ci-status.sh reports the lanes for a commit.
# The rust job runs cold on the shared ubuntu-latest runner (truenas-shared) until a shared `rust` runner with a
# persistent cargo cache serves this repo (P1-D01: the owner re-registers Physical Soccer's repository-scoped `rust`
# runners as shared). No actions/cache: truenas-shared's cache server times out from job containers (run 996).
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check (native)
        run: cargo check --workspace --all-targets --locked
      - name: Check (wasm facades)
        run: cargo check --locked --target wasm32-unknown-unknown -p jj-wasm-host -p jj-wasm-procgen -p jj-wasm-input
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: No Tokio (R2)
        run: scripts/ci/no-tokio.sh
      - name: cargo deny
        run: command -v cargo-deny >/dev/null || cargo install --locked cargo-deny; scripts/ci/deny.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Runtime origins (P1-F03, R70)
        run: npm --prefix web run qualify && node scripts/ci/origin-scan.mjs web/dist web/dist-qualify

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm --prefix web ci
      - name: UI tokens (P1-U01)
        run: node art/ui/check.mjs
      - name: Announcer cue sheet (P1-A00)
        run: python3 tools/audio/check_cues.py tools/audio/cues-playtest1.tsv && python3 tools/audio/test_check_cues.py
      - name: Engine synth bundle and profile copy are current (P1-A04)
        run: node art/ui/poc/audio/engine/build.mjs --check
      - name: jammers-look recipes match the rendered code (P1-F11)
        run: node .claude/skills/jammers-look/example/check-recipes.mjs
