# CI (docs/infra/ci.md). A push runs only what its changes can affect, and every job starts at once:
#   - Each job's first step is scripts/ci/plan.mjs: the paths changed since the last green run of this workflow pick
#     the suites (a shared contract, the Cargo workspace, a crate others depend on, web/shared, maps, assets, the build
#     config or this file widen it to everything that depends on it), and the job's other steps run only if it's
#     selected. The plan is deterministic, so every job agrees; the log of each prints the one-line selection.
#   - rust-lint (fmt, check, clippy, deny, jj validate) and rust-test (nextest at opt-level 1, the selected crates and
#     their dependents) on the `rust` runners' persistent /cargo-cache.
#   - build: the one web build (WASM, Vite pages, the S02 harness, jj and jj-server), keyed by its inputs and kept in
#     Gitea's package store (scripts/ci/web-store.sh). A stored key is never rebuilt.
#   - browser: a static matrix of 7 slots on the `browser` runners. plan packs the selected targets into them, longest
#     first: whole files, or single tests of a long file (scripts/ci/targets.mjs). A slot reads the build from its
#     host's cache or the store, waiting for the build job only when the build is new. The SSE soak is 20 s on a
#     push and 300 s in the full run.
#   - checks always; image when its inputs changed.
# The full matrix (every suite, the 300 s soak) runs nightly and on a manual dispatch: same coverage, different timing.
# Jobs run in the jj-ci image (scripts/ci/ci-image.Dockerfile, built on each runner host by scripts/ci/ci-image.sh):
# node, Playwright's Chromium and its libraries, coturn, git-lfs, wasm-bindgen and nextest are baked in.
# No actions/cache: truenas-shared's cache server times out from job containers (run 996).
name: CI

on:
  push:
  schedule:
    - cron: "17 15 * * *" # 01:17 AEST, the full matrix
  workflow_dispatch:

# One run per branch at a time: a running one finishes (so closes always get a verdict), and a newer push replaces any
# run still waiting; the next run diffs from the last green run, so nothing a replaced run held is lost.
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: false

env:
  CARGO_HOME: /cargo-cache/cargo
  RUSTUP_HOME: /cargo-cache/rustup
  CARGO_INCREMENTAL: "0"
  npm_config_cache: /cargo-cache/npm
  GITEA_TOKEN: ${{ github.token }}
  JJ_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: jj-ci:5890cf2da9ac
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund --prefer-offline && npm --prefix web ci --no-audit --no-fund --prefer-offline
      # The checks lane, one script with the verifier's local runner (scripts/beads/batch-verify.sh).
      - name: Checks (tokens, grid, cues, engine bundle, look recipes, surface strips, vehicle bake)
        run: scripts/ci/checks.sh

  # Format, check, clippy, the supply-chain and Tokio bans and the committed data validating: always the whole
  # workspace (cheap on the warm cache), whenever any Rust is selected.
  rust-lint:
    runs-on: rust
    container:
      image: jj-ci:5890cf2da9ac
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /cargo-cache/target-jammers
    steps:
      - uses: actions/checkout@v4
      - name: Select (scripts/ci/plan.mjs)
        id: plan
        run: node scripts/ci/plan.mjs --github-output "$GITHUB_OUTPUT"
      - name: Toolchain (rust-toolchain.toml) on the persistent cache
        if: steps.plan.outputs.rust == 'true'
        run: scripts/ci/toolchain.sh
      # fmt, check (native and WASM), clippy, jj validate x3, no Tokio, cargo deny: one script with the local runner.
      - name: Lint (scripts/ci/rust-lint.sh)
        if: steps.plan.outputs.rust == 'true'
        run: scripts/ci/rust-lint.sh

  # The tests of the selected crates and everything that depends on them, at opt-level 1 (debug assertions and overflow
  # checks stay on; the sim and procgen banks run ~8x faster than unoptimised), every test binary in parallel.
  rust-test:
    runs-on: rust
    container:
      image: jj-ci:5890cf2da9ac
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /cargo-cache/target-jammers-o1
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      JJ_COTURN_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select (scripts/ci/plan.mjs)
        id: plan
        run: node scripts/ci/plan.mjs --github-output "$GITHUB_OUTPUT"
      - name: Toolchain (rust-toolchain.toml) on the persistent cache
        if: steps.plan.outputs.rust == 'true'
        run: scripts/ci/toolchain.sh
      - name: Test (the selected crates)
        if: steps.plan.outputs.rust == 'true'
        run: scripts/ci/rust-test.sh ${{ steps.plan.outputs.crates }}

  build:
    runs-on: rust
    container:
      image: jj-ci:5890cf2da9ac
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /cargo-cache/target-jammers-wasm
      JJ_STORE_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Select (scripts/ci/plan.mjs)
        id: plan
        run: node scripts/ci/plan.mjs --github-output "$GITHUB_OUTPUT"
      # A stored key returns at once; a miss pulls the LFS objects the pages bundle and the toolchain itself.
      - name: Build and store (unless this key is already stored)
        if: steps.plan.outputs.build == 'true'
        run: scripts/ci/build-web.sh

  browser:
    runs-on: browser
    container:
      image: jj-ci:5890cf2da9ac
      options: --shm-size=2g
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7]
    env:
      JJ_STORE_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Select (scripts/ci/plan.mjs)
        id: plan
        run: node scripts/ci/plan.mjs --github-output "$GITHUB_OUTPUT"
      - name: The web build (this host's cache, else the store; waits for the build job only when it's new)
        if: steps.plan.outputs.build == 'true' && fromJSON(steps.plan.outputs.n) >= matrix.slot
        run: scripts/ci/fetch-web.sh
      - name: Vehicle, brand and audio LFS objects
        if: steps.plan.outputs.build == 'true' && fromJSON(steps.plan.outputs.n) >= matrix.slot
        run: git lfs pull --include "art/vehicles/**,art/ui/brand/**,assets/audio/**"
      - name: Slot ${{ matrix.slot }}
        if: steps.plan.outputs.build == 'true' && fromJSON(steps.plan.outputs.n) >= matrix.slot
        env:
          JJ_SOAK_S: ${{ steps.plan.outputs.soak }}
          SLOTS: ${{ steps.plan.outputs.slots }}
        run: node scripts/ci/run-slot.mjs ${{ matrix.slot }} "$SLOTS"

  # The jj-server image (P1-D02), built natively for linux/amd64 on the Jammers runner (the only one whose jobs get the
  # host's Docker socket), smoked as two previews of the same digest, then pushed to the Gitea registry by commit and
  # recorded by digest. Pushing through 127.0.0.1 keeps the registry on the host (Docker allows loopback over HTTP).
  image:
    runs-on: jammers-docker
    timeout-minutes: 45
    env:
      REGISTRY: 127.0.0.1:3001
      IMAGE: 127.0.0.1:3001/cdilga/jj-server
    steps:
      - uses: actions/checkout@v4
      - name: Select (scripts/ci/plan.mjs)
        id: plan
        run: node scripts/ci/plan.mjs --github-output "$GITHUB_OUTPUT"
      # Nothing the image is built from changed since the last green commit: give HEAD that commit's image under HEAD's
      # tag, so every green commit has an image the publisher can deploy (a test- or docs-only push used to leave the
      # newest green commits imageless, and previews stopped following them).
      - name: Re-tag the last green commit's image for this commit (no image inputs changed)
        if: steps.plan.outputs.image != 'true' && steps.plan.outputs.base != '' && github.ref == 'refs/heads/v0.2-revamp'
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          BASE_SHA: ${{ steps.plan.outputs.base }}
        run: |
          to="$IMAGE:$(git rev-parse --short=12 HEAD)"
          echo "$REGISTRY_PUSH_TOKEN" | docker login "$REGISTRY" -u cdilga --password-stdin
          # The base may itself be a commit that never got an image (before this step existed): walk back from it to the
          # newest commit that has one. Nothing the image reads changed along the way, or that commit's run would have
          # rebuilt it.
          git fetch -q --depth=100 origin "$BASE_SHA"
          from=""
          for c in $(git rev-list --max-count=100 "$BASE_SHA"); do
            t="$IMAGE:${c:0:12}"
            if docker image inspect "$t" >/dev/null 2>&1 || docker pull -q "$t" >/dev/null 2>&1; then from=$t; break; fi
          done
          [ -n "$from" ] || { echo "no image for $BASE_SHA or its 100 ancestors"; exit 1; }
          echo "re-tagging $from as $to"
          docker tag "$from" "$to"
          docker push -q "$to"
          docker inspect -f '{{index .RepoDigests 0}}' "$to" | tee image-digest.txt
          docker logout "$REGISTRY"
      - name: Art and assets from LFS (the web bundle bakes them in)
        if: steps.plan.outputs.image == 'true'
        run: |
          command -v git-lfs >/dev/null || (apt-get update -qq && apt-get install -y -qq git-lfs)
          git lfs install --local && git lfs pull --include "art/**,assets/**"
      - name: Build (BuildKit, cache mounts warm on the host)
        if: steps.plan.outputs.image == 'true'
        run: |
          tag=$(git rev-parse --short=12 HEAD)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          DOCKER_BUILDKIT=1 docker build -f docker/jj-server.Dockerfile --build-arg JJ_BUILD="$tag" -t "$IMAGE:$tag" .
      - name: Non-root, no secrets in any layer
        if: steps.plan.outputs.image == 'true'
        run: |
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE:$TAG")" = 10001
          ! docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE:$TAG" | grep -Ei 'token=|secret=|password=|_KEY='
          ! docker inspect -f '{{json .Config.Env}}' "$IMAGE:$TAG" | grep -Ei 'token|secret|password|_key'
      # One long-lived curl container answers every probe (a `docker run` per probe cost ~8 s each on this host).
      - name: Two previews of one image under /p/a/ and /p/b/ (version, health, no root-relative leak)
        if: steps.plan.outputs.image == 'true'
        run: |
          net="jj-smoke-$TAG-$GITHUB_RUN_ID"
          docker network create "$net"
          trap 'docker rm -f "a-$net" "b-$net" "c-$net" >/dev/null 2>&1; docker network rm "$net" >/dev/null 2>&1' EXIT
          docker run -d --name "a-$net" --network "$net" -e JJ_BASE_PATH=/p/a/ -e JJ_BUILD=a "$IMAGE:$TAG"
          docker run -d --name "b-$net" --network "$net" -e JJ_BASE_PATH=/p/b/ -e JJ_BUILD=b "$IMAGE:$TAG"
          docker run -d --name "c-$net" --network "$net" --entrypoint sleep curlimages/curl:8.16.0 600
          curl_() { docker exec "c-$net" curl -s "$@"; }
          for i in $(seq 60); do curl_ -f "http://a-$net:8080/p/a/healthz" >/dev/null && curl_ -f "http://b-$net:8080/p/b/healthz" >/dev/null && break; sleep 0.5; done
          curl_ -f "http://a-$net:8080/p/a/version" | tee /dev/stderr | grep -q '"build":"a"'
          curl_ -f "http://b-$net:8080/p/b/version" | grep -q '"build":"b"'
          curl_ "http://a-$net:8080/p/a/healthz" | grep -q '"relayFallback":"unavailable"'
          for p in /version /assets/ /host /p/b/version; do
            code=$(curl_ -o /dev/null -w '%{http_code}' "http://a-$net:8080$p")
            test "$code" = 404 || { echo "a answered $code for $p"; exit 1; }
          done
          js=$(curl_ -f "http://a-$net:8080/p/a/host" | grep -o '/p/a/assets/host-[^"]*' | head -1)
          test -n "$js" && curl_ -f -o /dev/null "http://a-$net:8080$js"
          docker exec "a-$net" /app/jj-server --healthcheck
      - name: Push, by commit, recorded by digest
        if: steps.plan.outputs.image == 'true' && github.ref == 'refs/heads/v0.2-revamp'
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          echo "$REGISTRY_PUSH_TOKEN" | docker login "$REGISTRY" -u cdilga --password-stdin
          docker push "$IMAGE:$TAG"
          docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | tee image-digest.txt
          docker logout "$REGISTRY"
