# CI from P1-F01, brought up on Gitea by P1-D01: the checks the workspace scaffold guarantees. P1-F02 grows this into
# the fast/build/browser lanes (Playtest-1 plan §12.1); scripts/ci-status.sh reports the lanes for a commit.
# The rust job runs on the shared `rust` runners (truenas-rust, triton-rust: instance-wide since 2026-10-03), whose
# job containers mount a persistent /cargo-cache. rustup, the pinned toolchain and cargo tools install there once;
# Jammers keeps its own target dir so Physical Soccer's builds on the same cache don't evict ours (P1-D01 AC1/AC3).
# No actions/cache: truenas-shared's cache server times out from job containers (run 996).
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  rust:
    runs-on: rust
    timeout-minutes: 45
    env:
      CARGO_HOME: /cargo-cache/cargo
      RUSTUP_HOME: /cargo-cache/rustup
      CARGO_TARGET_DIR: /cargo-cache/target-jammers
      CARGO_BUILD_JOBS: "12"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml) on the persistent cache
        run: |
          test -w /cargo-cache
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" show active-toolchain || "$CARGO_HOME/bin/rustup" toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check (native)
        run: cargo check --workspace --all-targets --locked
      - name: Check (wasm facades)
        run: cargo check --locked --target wasm32-unknown-unknown -p jj-wasm-host -p jj-wasm-procgen -p jj-wasm-input
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p jj-wasm-host --features testing --all-targets --locked -- -D warnings
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo test -p jj-wasm-host --features testing --locked
      - name: WASM parity in Node (jj-map P1-M01, jj-procgen P1-M03a)
        run: |
          if ! wasm-bindgen-test-runner --version 2>/dev/null | grep -q ' 0\.2\.129'; then
            curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
            cp /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen-test-runner "$CARGO_HOME/bin/"
          fi
          cargo test --locked --target wasm32-unknown-unknown -p jj-map -p jj-procgen --test wasm_parity
      - name: The greybox validates (jj validate)
        run: cargo run --locked -q -p jj-tools --bin jj -- validate maps/greybox-loop.json
      - name: A generated map validates (jj procgen, P1-M03a)
        run: cargo run --locked -q -p jj-tools --bin jj -- procgen --seed 42 --json
      - name: The Cruz Missile's committed bake validates, and its profile still matches it (jj validate, P1-V02, P1-S03a)
        run: |
          command -v git-lfs >/dev/null || (apt-get update -qq && apt-get install -y -qq git-lfs)
          git lfs install --local
          git lfs pull --include="art/vehicles/cruz-missile/cruz-missile.*"
          cargo run --locked -q -p jj-tools --bin jj -- validate art/vehicles/cruz-missile/cruz-missile.asset.json assets/profiles/cruz-missile.json maps/test/surface-strips.json
      - name: No Tokio (R2)
        run: scripts/ci/no-tokio.sh
      - name: cargo deny
        run: command -v cargo-deny >/dev/null || cargo install --locked cargo-deny; scripts/ci/deny.sh

  # The web build, on a rust runner since the host bundles the sim worker's WASM (P1-S02): both jj-wasm-host builds,
  # the pages, the bundle and origin checks, then the host in headless Chromium: the sim worker (P1-S02) and the test
  # surface against the native `jj sim` hash (P1-F05b). Its own target dir so it never waits on the rust job's lock.
  web:
    runs-on: rust
    timeout-minutes: 30
    env:
      CARGO_HOME: /cargo-cache/cargo
      RUSTUP_HOME: /cargo-cache/rustup
      CARGO_TARGET_DIR: /cargo-cache/target-jammers-wasm
      CARGO_BUILD_JOBS: "12"
      PLAYWRIGHT_BROWSERS_PATH: /cargo-cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Toolchain and wasm-bindgen 0.2.129 on the persistent cache
        run: |
          test -w /cargo-cache
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" show active-toolchain || "$CARGO_HOME/bin/rustup" toolchain install
          if ! "$CARGO_HOME/bin/wasm-bindgen" --version 2>/dev/null | grep -q ' 0\.2\.129'; then
            curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
            cp /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen "$CARGO_HOME/bin/"
          fi
      - name: The sim worker's WASM, shipped and testing builds (scripts/build-host-wasm.sh)
        run: scripts/build-host-wasm.sh
      - run: npm ci && npm --prefix web ci
      - name: Typecheck the two workers (their own WebWorker programs)
        run: |
          npx --prefix web tsc --noEmit -p web/host/src/worker/tsconfig.json
          npx --prefix web tsc --noEmit -p web/host/src/testing/tsconfig.json
      - run: npm --prefix web run build
      - name: No test code in the shipped bundles (P1-F05b)
        run: node scripts/ci/bundle-check.mjs web/dist
      - name: Runtime origins (P1-F03, R70)
        run: npm --prefix web run qualify && node scripts/ci/origin-scan.mjs web/dist web/dist-qualify
      - name: The S02 harness and the native jj (for the hash comparison)
        run: |
          npx --prefix web vite build --config web/host/tests/vite.config.ts
          cargo build --locked -q -p jj-tools --bin jj
      - name: Chromium headless shell (Playwright 1.62.1)
        run: npx playwright install --with-deps --only-shell chromium
      # One file at a time: every host page renders on the CPU here (software GL), so parallel files starve each
      # other's timers and the timing tests (input age, snapshot starvation) measure the runner, not the host.
      - name: The host in Chromium (P1-S02 sim worker, P1-F05b test surface, P1-R01/R02 renderer)
        run: JJ_BIN="$CARGO_TARGET_DIR/debug/jj" node --test --test-concurrency=1 web/host/tests/

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm --prefix web ci
      - name: UI tokens (P1-U01)
        run: node art/ui/check.mjs
      - name: TV grid rule, equal tiles at any N (P1-U02.2, R95)
        run: node art/ui/poc/tv/grid-check.mjs
      - name: Announcer cue sheet (P1-A00)
        run: python3 tools/audio/check_cues.py tools/audio/cues-playtest1.tsv && python3 tools/audio/test_check_cues.py
      - name: Engine synth bundle and profile copy are current (P1-A04)
        run: node art/ui/poc/audio/engine/build.mjs --check
      - name: jammers-look recipes match the rendered code (P1-F11)
        run: node .claude/skills/jammers-look/example/check-recipes.mjs
      - name: The surface-strips test map is what its generator writes (P1-S03a)
        run: python3 tools/maps/surface_strips.py && git diff --exit-code maps/test/surface-strips.json
      - name: Vehicle bake is reproducible and committed; loads in three.js (P1-V02)
        run: node tools/vehicles/bake.mjs --check && node --test tools/vehicles/test/
