# Continuous delivery of the design POC (plan §3a): every push to v0.2-revamp that touches art/ui/poc/ goes to
# https://jammers-preview.dilger.dev/poc/ with no manual step. Interim path until P1-D03/D04 publish through the
# edge router; D03 keeps serving /poc/ from the same folder. Needs the one-time setup in P1-D03a (edge bind mount,
# POC_DEPLOY_KEY secret).
name: POC deploy

on:
  push:
    branches: [v0.2-revamp]
    paths: ["art/ui/**", ".gitea/workflows/poc-deploy.yml", "scripts/poc-publish.sh"]
  workflow_dispatch:

concurrency:
  group: poc-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: command -v rsync >/dev/null && command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync openssh-client)
      - name: Publish
        env:
          POC_DEPLOY_KEY: ${{ secrets.POC_DEPLOY_KEY }}
        run: scripts/poc-publish.sh
