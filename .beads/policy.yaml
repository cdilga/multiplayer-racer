# Bead workflow for Joystick Jammers 0.2 (br >= 0.7.4). Physical Soccer's model (owner, 2026-10-03).
# Human-readable version: docs/process/bead-workflow.md
#
#   open/rework -> in_progress ----------------------> closed   (the session closes its own bead
#                      |                                ^        once CI is green, citing the run)
#                      +-> batch_pending ---------------+        (or hands off; the verifier closes)
#                              |
#                              +-> rework (red CI, back to the same assignee)
#
# Every close needs a `batch_verify` gate pass for the current revision (provider gitea-ci, local or
# batch-verifier), a `receipt:` reference in the reason and every acceptance item ticked.
# Prove enforcement with scripts/beads/canary.sh after any edit to this file or a br upgrade.

allow_bypass: false            # `br close --bypass-policy` is rejected

close_policy:
  require_close_reason:
    enabled: true
    min_length: 40
  # Every close cites its evidence, e.g. `receipt:<Gitea CI run url>` or `receipt:docs/evidence/P1-XXX/…`.
  require_typed_references:
    enabled: true
    required_kinds: [receipt]
  # Sessions close their own beads on green CI (Physical Soccer's model).
  forbid_self_close_after_in_progress:
    enabled: false
  forbid_close_with_deferred_dependents:
    enabled: true

workflow:
  strict: true
  statuses: [open, in_progress, batch_pending, rework, blocked, deferred, closed, tombstone]

  transitions:
    initial: [open, deferred, blocked]
    open: [in_progress, blocked, deferred]
    rework: [in_progress, blocked, deferred]
    in_progress: [closed, batch_pending, open, rework, blocked]   # open/rework = unclaim
    batch_pending: [closed, rework, in_progress]                  # in_progress = the assignee fixes forward
    blocked: [open]
    deferred: [open]
    closed: [open]                                                # reopen (with --reason)

  # Epics aggregate children and close once every child is closed (br refuses otherwise).
  class_transitions:
    - {issue_type: epic, from: open, to: closed}

  status_groups:
    ready: [open, rework]

  required_fields:
    "open -> in_progress": [acceptance_criteria_present]
    "rework -> in_progress": [acceptance_criteria_present]
    # Hand-off note: commit SHA(s) + which test covers each acceptance item.
    "in_progress -> batch_pending": [acceptance_criteria_present, transition_comment]
    # Failure note: exact failing assertion + file:line, for the same assignee.
    "batch_pending -> rework": [transition_comment]
    # Every acceptance box ticked by the closer; none may stay open.
    "in_progress -> closed": [acceptance_criteria, transition_comment]
    "batch_pending -> closed": [acceptance_criteria, transition_comment]
    "closed -> open": [transition_comment]                        # `br reopen --reason`

  # `--force` never bypasses gates.
  gates:
    "in_progress -> closed":
      require_all:
        - batch_verify
    "batch_pending -> closed":
      require_all:
        - batch_verify
    "open -> closed":
      require_all:
        - batch_verify
