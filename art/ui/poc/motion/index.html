<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion reel</title>
<link rel="icon" href="../../brand/favicon.svg">
<style>html, body { background: #15203a; }</style>
<link rel="stylesheet" href="../tv/tv.css">
<link rel="stylesheet" href="./motion.css">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas id="world"></canvas>
<div id="ui"></div>
<header id="bar" aria-label="Motion reel">
  <div class="bar-l">
    <div class="bar-name display italic" id="bar-name">Motion reel</div>
    <div class="bar-detail"><span id="bar-detail">Loading…</span><span id="bar-measured"></span></div>
  </div>
  <div class="bar-r">
    <nav class="steps" id="steps" aria-label="Transitions"></nav>
    <div class="rswitch" id="rswitch" role="group" aria-label="Motion">
      <button type="button" data-m="full">Full</button><button type="button" data-m="reduced">Reduced</button>
    </div>
  </div>
</header>
<script type="module" src="./reel.js"></script>
</body>
</html>
