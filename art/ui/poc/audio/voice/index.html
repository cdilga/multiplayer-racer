<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcer voice audition</title>
<meta name="description" content="Broad Australian excited announcer: prompt-only candidates, restyle-once references, and two TTS engines side by side. P1-A01b design-review gallery.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315203A'/%3E%3Crect x='22' y='10' width='20' height='30' rx='10' fill='%23F4B400'/%3E%3Cpath d='M14 32a18 18 0 0 0 36 0M32 50v6' stroke='%23F4B400' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Colours, type and spacing come from the P1-U01 tokens (art/ui/tokens.json) via the variables page.js defines. */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--c-paper); }
body { margin: 0; background: var(--c-paper); color: var(--c-ink); font-family: var(--font-body); font-weight: 500; font-size: var(--fs-body); line-height: 1.3; -webkit-font-smoothing: antialiased; }
body[data-ready="false"] .page { visibility: hidden; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
button { font: inherit; color: inherit; margin: 0; }
:focus-visible { outline: var(--focus-kb-w) solid var(--c-cobalt); outline-offset: var(--focus-kb-off); }
.band { height: 18px; background: repeating-linear-gradient(-45deg, var(--c-saffron) 0 14px, var(--c-ochre) 14px 28px); border-bottom: var(--outline) solid var(--c-ink); }
/* The page scrolls inside .page (not the document) so live-check's fold test sees a scroll container. */
body { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
.page { flex: 1 1 auto; min-height: 0; width: 100%; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 max(var(--sp-5), calc((100% - 1100px) / 2)) var(--sp-9); }
.masthead { padding: var(--sp-6) 0 var(--sp-4); }
.overline { font-weight: 700; font-size: var(--fs-label); letter-spacing: .08em; text-transform: uppercase; color: var(--c-cobalt-deep); }
.masthead h1 { display: inline-block; margin-top: var(--sp-2); padding: 0 .12em; font: 900 italic var(--fs-display)/.95 var(--font-display); text-transform: uppercase; background: linear-gradient(var(--c-saffron), var(--c-saffron)) 0 90% / 100% .26em no-repeat; }
.lede { margin-top: var(--sp-3); max-width: 66ch; color: var(--c-ink-soft); }
.caveat { margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4); background: var(--c-paper-shade); border: var(--outline) solid var(--c-ink); border-radius: var(--radius); max-width: 72ch; }
.caveat b { color: var(--c-ink); }
nav.jump { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4); }
nav.jump a { padding: var(--sp-1) var(--sp-3); border: 2px solid var(--c-ink); border-radius: 999px; font-weight: 700; font-size: var(--fs-label); text-decoration: none; color: var(--c-ink); background: var(--c-paper); }
section.group { margin-top: var(--sp-8); scroll-margin-top: var(--sp-4); }
section.group > h2 { font: 900 italic var(--fs-title)/1.1 var(--font-display); text-transform: uppercase; }
section.group > p { margin-top: var(--sp-2); color: var(--c-ink-soft); max-width: 72ch; }
.blocks { display: grid; gap: var(--sp-6); margin-top: var(--sp-5); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .blocks.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.block { padding: var(--sp-4); background: var(--c-paper); border: var(--outline) solid var(--c-ink); border-radius: var(--radius); box-shadow: 0 var(--sh-y) 0 var(--shadow-c); min-width: 0; }
.block header { display: flex; gap: var(--sp-3); align-items: flex-start; }
.letter { flex: none; display: grid; place-items: center; min-width: 2.2em; height: 2.2em; padding: 0 .3em; background: var(--c-saffron); border: var(--outline) solid var(--c-ink); font: 900 italic var(--fs-title)/1 var(--font-display); transform: skewX(-9deg); }
.block h3 { font-weight: 800; font-size: var(--fs-body); }
.block .sub { color: var(--c-ink-soft); font-size: var(--fs-label); margin-top: 2px; overflow-wrap: anywhere; }
.block .sub b { color: var(--c-ink); }
.tools { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
.btn { min-height: var(--touch); padding: 0 var(--sp-4); background: var(--c-saffron); border: var(--outline) solid var(--c-ink); border-radius: var(--radius); box-shadow: 0 var(--sh-y) 0 var(--shadow-c); font-weight: 800; cursor: pointer; }
.btn:active { transform: translateY(var(--sh-y)); box-shadow: none; }
ul.clips { margin-top: var(--sp-3); display: grid; gap: var(--sp-3); }
ul.clips li { padding-top: var(--sp-3); border-top: 2px solid var(--c-paper-shade); min-width: 0; }
.cue { font-size: var(--fs-label); color: var(--c-ink); overflow-wrap: anywhere; }
.cue i { color: var(--c-cobalt-deep); font-style: normal; font-weight: 800; margin-right: .4em; }
audio { width: 100%; height: 40px; margin-top: var(--sp-1); display: block; }
.missing { margin-top: var(--sp-1); font-size: var(--fs-label); color: var(--c-danger); }
.m { display: flex; flex-wrap: wrap; gap: 2px var(--sp-3); margin-top: 2px; font-size: var(--fs-label); color: var(--c-ink-soft); font-variant-numeric: tabular-nums; }
.m span b { color: var(--c-ink); font-weight: 700; }
.heard { margin-top: 2px; font-size: var(--fs-label); color: var(--c-ink-soft); overflow-wrap: anywhere; }
.m .bad b { color: var(--c-danger); }
footer { margin-top: var(--sp-8); color: var(--c-ink-soft); font-size: var(--fs-label); max-width: 72ch; }
footer a, .back a { color: var(--c-cobalt-deep); }
.back { margin-top: var(--sp-4); font-size: var(--fs-label); }
</style>
</head>
<body data-ready="false">
<div class="band"></div>
<main class="page">
  <div class="back"><a href="../../">Design gallery</a></div>
  <header class="masthead">
    <div class="overline">P1-A01b · Announcer voice</div>
    <h1>Voice audition</h1>
    <p class="lede" id="lede"></p>
    <p class="caveat" id="caveat"></p>
    <nav class="jump" id="jump" aria-label="Sections"></nav>
  </header>
  <div id="app"><p class="lede">Loading the audition...</p></div>
  <footer id="foot"></footer>
</main>
<script type="module" src="./page.js"></script>
</body>
</html>
